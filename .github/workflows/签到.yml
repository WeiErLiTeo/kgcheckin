name: 酷狗音乐打卡与推送
on:
  workflow_dispatch:
    inputs:
      action:
        description: '选择手动运行的任务'
        required: true
        default: 'checkin'
        type: choice
        options:
          - checkin
          - notify
          - both
  schedule:
    - cron: '10 17 * * *'
    - cron: '5 0 * * *'
permissions:
  contents: write
  actions: write

jobs:
  checkin:
    name: 凌晨签到
    if: github.event.schedule == '10 17 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.action == 'checkin' || inputs.action == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 创建 Node 环境
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ./api/package-lock.json
      - name: 缓存依赖
        id: cache-npm
        uses: actions/cache@v4
        with:
          path: ./api/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./api/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: 安装依赖
        run: npm run install
        if: ${{ steps.cache-npm.outputs.cache-hit != 'true' }}
      - name: 执行签到并记录日志
        run: |
          mkdir -p /tmp/checkin_data
          npm run main > /tmp/checkin_data/checkin.txt 2>&1 || true
          cat /tmp/checkin_data/checkin.txt
          
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main || true
          
          mkdir -p log
          cp /tmp/checkin_data/checkin.txt log/checkin.txt
          git add -f log/checkin.txt
          git commit -m "chore: record checkin log" || exit 0
          git push origin main
        env:
          USERINFO: ${{ secrets.USERINFO }}
          PAT: ${{ secrets.PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  notify:
    name: 消息推送
    needs: [checkin]
    if: |
      always() &&
      (
        github.event.schedule == '5 0 * * *' ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'notify') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'both' && needs.checkin.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 推送打卡日志到所有渠道
        run: |
          if [ -f log/checkin.txt ]; then
            node -e '
              const fs = require("fs");
              let content = fs.readFileSync("log/checkin.txt", "utf8");
              content = content.replace(/\x1b\[[0-9;]*[a-zA-Z]/g, "").trim();
              const message = "🎵 酷狗音乐打卡通知\n\n" + content;

              async function runNotify() {
                // 1. 推送企业微信群机器人 (之前的群通知)
                const wecomKey = process.env.WECOM_BOT_KEY;
                if (wecomKey) {
                  try {
                    const res = await fetch(`https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=${wecomKey}`, {
                      method: "POST",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify({
                        msgtype: "text",
                        text: { content: message }
                      })
                    });
                    const data = await res.json();
                    console.log("群机器人推送结果:", data);
                  } catch (e) {
                    console.error("群机器人推送失败:", e.message);
                  }
                }

                // 2. 推送个人微信 (自建应用微工作台，直接弹微信服务号)
                const corpId = process.env.WECOM_CORP_ID;
                const corpSecret = process.env.WECOM_CORP_SECRET;
                const agentId = process.env.WECOM_AGENT_ID;

                if (corpId && corpSecret && agentId) {
                  try {
                    const tokenRes = await fetch(`https://qyapi.weixin.qq.com/cgi-bin/gettoken?corpid=${corpId}&corpsecret=${corpSecret}`);
                    const tokenData = await tokenRes.json();
                    
                    if (tokenData.access_token) {
                      const sendRes = await fetch(`https://qyapi.weixin.qq.com/cgi-bin/message/send?access_token=${tokenData.access_token}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                          touser: "@all",
                          msgtype: "text",
                          agentid: agentId,
                          text: { content: message },
                          safe: 0
                        })
                      });
                      const sendData = await sendRes.json();
                      console.log("个人微信推送结果:", sendData);
                    } else {
                      console.error("获取企业微信 Token 失败:", tokenData);
                    }
                  } catch (e) {
                    console.error("个人微信推送异常:", e.message);
                  }
                }

                // 3. 推送 Telegram
                const tgToken = process.env.TG_BOT_TOKEN;
                const tgChatId = process.env.TG_USER_ID;
                if (tgToken && tgChatId) {
                  try {
                    const res = await fetch(`https://api.telegram.org/bot${tgToken}/sendMessage`, {
                      method: "POST",
                      headers: { "Content-Type": "application/json" },
                      body: JSON.stringify({ chat_id: tgChatId, text: message })
                    });
                    const data = await res.json();
                    console.log("TG 推送结果:", data.ok ? "成功" : data);
                  } catch (e) {
                    console.error("TG 推送失败:", e.message);
                  }
                }
              }

              runNotify();
            '
            git config --local user.name "github-actions[bot]"
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git pull origin main || true
            rm -f log/checkin.txt
            git add -A log/
            git commit -m "chore: clean checkin log" || exit 0
            git push origin main
          else
            echo "未找到 log/checkin.txt 文件，跳过本次推送"
          fi
        env:
          WECOM_BOT_KEY: ${{ secrets.WECOM_BOT_KEY }}
          WECOM_CORP_ID: ${{ secrets.WECOM_CORP_ID }}
          WECOM_CORP_SECRET: ${{ secrets.WECOM_CORP_SECRET }}
          WECOM_AGENT_ID: ${{ secrets.WECOM_AGENT_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
